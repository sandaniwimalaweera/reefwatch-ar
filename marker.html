<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Scan the card — ReefWatch AR</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Public+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="css/ar.css">
</head>
<body class="ar-body">

  <!-- Shown until the marker is found -->
  <div class="ar-prompt" id="prompt">
    <div class="ar-prompt-inner">
      <div class="ar-scanline" aria-hidden="true"></div>
      <p class="ar-prompt-title">Point at the card</p>
      <p class="ar-prompt-copy">Hold your phone about 30&nbsp;cm from the printed reef photo.</p>
    </div>
  </div>

  <div class="ar-hint" id="hint" hidden>Tap the coral</div>

  <div class="ar-card" id="card" hidden>
    <p class="ar-card-eyebrow" id="cardState">Healthy</p>
    <p class="ar-card-name">Staghorn coral</p>
    <p class="ar-card-copy" id="cardCopy">
      Living tissue holds algae that feed the coral and give it its colour.
    </p>
  </div>

  <a class="ar-back" href="index.html">Back</a>

  <a-scene
    mindar-image="imageTargetSrc: assets/targets/targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="coralModel" src="assets/models/coral.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- Everything below is rotated so the scene stands up off the card
           rather than lying flat on it. -->
      <a-entity rotation="-90 0 0">

        <!-- Light rig -->
        <a-entity light="type: ambient; color: #9FD8EA; intensity: 0.7"></a-entity>
        <a-entity light="type: directional; color: #FFFFFF; intensity: 0.85" position="0.6 1.4 0.8"></a-entity>
        <a-entity light="type: directional; color: #5FC6F0; intensity: 0.4" position="-0.8 0.2 -0.6"></a-entity>
        <a-entity caustic-light></a-entity>

        <!-- The coral. fit-to-card sizes it automatically, so no
             hand-tuned scale value is needed for a new model. -->
        <a-entity
          id="coral"
          gltf-model="#coralModel"
          fit-to-card="size: 0.22"
          bleachable
          tap-to-bleach
          class="clickable">
        </a-entity>

        <!-- School. Each fish runs its own orbit, speed and phase. -->
        <a-entity reef-fish="hue: #FFB35C; belly: #FFF0D8; radius: 0.16; height: 0.09; speed: 0.42; phase: 0.0;  length: 0.085"></a-entity>
        <a-entity reef-fish="hue: #6FE3D0; belly: #E8FFFA; radius: 0.20; height: 0.15; speed: 0.31; phase: 2.1;  length: 0.10"></a-entity>
        <a-entity reef-fish="hue: #FF8FA8; belly: #FFF0F3; radius: 0.14; height: 0.20; speed: 0.55; phase: 4.0;  length: 0.07"></a-entity>
        <a-entity reef-fish="hue: #FFE066; belly: #FFFBE8; radius: 0.23; height: 0.06; speed: 0.26; phase: 1.2;  length: 0.075"></a-entity>
        <a-entity reef-fish="hue: #8FB8FF; belly: #EFF5FF; radius: 0.11; height: 0.13; speed: 0.62; phase: 5.3;  length: 0.06"></a-entity>

        <!-- Drifting particulate -->
        <a-entity marine-snow="count: 70; spread: 0.7; top: 0.5"></a-entity>

      </a-entity>
    </a-entity>
  </a-scene>

  <script src="js/marker-scene.js"></script>
</body>
</html>
