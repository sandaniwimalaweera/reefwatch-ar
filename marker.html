<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Scan the card — ReefWatch AR</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Public+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="css/ar.css">
</head>
<body class="ar-body">

  <div class="ar-prompt" id="prompt">
    <div class="ar-prompt-inner">
      <div class="ar-scanline" aria-hidden="true"></div>
      <p class="ar-prompt-title">Point at the card</p>
      <p class="ar-prompt-copy">Hold your phone above the printed photo and look down into it.</p>
    </div>
  </div>

  <div class="ar-hint" id="hint" hidden>Tap to warm the water</div>

  <div class="ar-card" id="card" hidden>
    <p class="ar-card-eyebrow" id="cardState">Healthy</p>
    <p class="ar-card-name">Staghorn coral</p>
    <p class="ar-card-copy" id="cardCopy">
      Living tissue holds algae that feed the coral and give it its colour.
    </p>
  </div>

  <a class="ar-back" href="index.html">Back</a>

  <a-scene
    mindar-image="imageTargetSrc: assets/targets/targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true; sortObjects: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="coralModel" src="assets/models/coral.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- Rotated so that +Y is "up out of the card". Everything
           below the card therefore sits at negative Y. -->
      <a-entity rotation="-90 0 0">

        <!-- The opening, its walls and sand floor -->
        <a-entity portal-well="width: 0.78; depth: 0.46; drop: 0.54; rock: #123742; sand: #C6B99B"></a-entity>

        <!-- Light rig. Most of it points down into the well. -->
        <a-entity light="type: ambient; color: #7FB8CC; intensity: 0.55"></a-entity>
        <a-entity light="type: directional; color: #EAF8FF; intensity: 0.75" position="0.3 1.2 0.4"></a-entity>
        <a-entity caustic-light="intensity: 0.6"></a-entity>

        <!-- Coral, sitting on the sand at the bottom -->
        <a-entity
          id="coral"
          gltf-model="#coralModel"
          fit-in-well="size: 0.30; floor: -0.535"
          bleachable
          tap-to-bleach>
        </a-entity>

        <!-- School, swimming inside the well volume -->
        <a-entity reef-fish="hue: #FFB35C; radius: 0.24; depth: 0.13; level: -0.20; speed: 0.30; phase: 0.0; length: 0.058"></a-entity>
        <a-entity reef-fish="hue: #6FE3D0; radius: 0.30; depth: 0.16; level: -0.31; speed: 0.22; phase: 2.1; length: 0.070"></a-entity>
        <a-entity reef-fish="hue: #FF8FA8; radius: 0.19; depth: 0.10; level: -0.13; speed: 0.38; phase: 4.0; length: 0.048"></a-entity>
        <a-entity reef-fish="hue: #FFE066; radius: 0.33; depth: 0.17; level: -0.42; speed: 0.18; phase: 1.2; length: 0.052"></a-entity>
        <a-entity reef-fish="hue: #8FB8FF; radius: 0.15; depth: 0.09; level: -0.26; speed: 0.45; phase: 5.3; length: 0.042"></a-entity>
        <a-entity reef-fish="hue: #FFA8E0; radius: 0.27; depth: 0.14; level: -0.38; speed: 0.26; phase: 3.4; length: 0.046"></a-entity>

        <!-- Particulate drifting down through the water column -->
        <a-entity marine-snow="count: 70; w: 0.72; d: 0.42; top: -0.02; drop: 0.5"></a-entity>

      </a-entity>
    </a-entity>
  </a-scene>

  <script src="js/marker-scene.js"></script>
</body>
</html>
